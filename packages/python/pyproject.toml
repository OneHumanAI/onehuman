[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onehumanai"
version = "0.1.0"
description = "Access control for the AI agents your customers log in with (Claude in Chrome, ChatGPT agent, Codex, Comet): hide private data, ask the account owner's passkey for risky actions, sign every decision. Flask, Django, FastAPI."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "OneHuman Inc.", email = "arif@onehuman.ai" }]
keywords = ["ai-agent", "agent-detection", "ai-security", "bot-detection", "flask", "django", "fastapi", "passkey", "webauthn", "claude-in-chrome", "chatgpt-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Flask",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = []

[project.optional-dependencies]
flask = ["flask>=2.2"]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.100"]

[project.urls]
Homepage = "https://onehuman.ai"
Documentation = "https://onehuman.ai/docs"
Source = "https://github.com/OneHumanAI/onehuman"

[tool.setuptools]
packages = ["onehumanai"]
