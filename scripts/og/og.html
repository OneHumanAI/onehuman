<!doctype html>
<!-- Source of web/og.png (the link preview). Render: node scripts/og/render.mjs -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block">
<style>
@font-face{font-family:"AlphaLyrae";src:url("../../web/AlphaLyrae-Medium.woff2") format("woff2");font-display:block}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0a0a0b;color:#f2f2f3;font-family:Inter,sans-serif;position:relative;padding:64px 90px 60px}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 360px at 18% -8%,rgba(125,240,192,.13),transparent 70%),radial-gradient(560px 320px at 100% 110%,rgba(138,180,255,.10),transparent 70%)}
body::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;font:600 22px/1 "AlphaLyrae",Inter;letter-spacing:.06em}
.logo img{height:30px}
.eyebrow{margin-top:44px;align-self:flex-start;font:500 15px/1 "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#a1a1aa;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 16px}
h1{margin-top:24px;font:500 66px/1.05 "AlphaLyrae",Inter;letter-spacing:-.02em;max-width:1000px}
h1 .a{color:#7df0c0;white-space:nowrap;font-feature-settings:"ss01" 1}
.sub{margin-top:22px;font-size:24px;line-height:1.4;color:#a1a1aa;max-width:900px}
.foot{margin-top:auto;display:flex;align-items:center;gap:18px}
.cmd{font:500 22px/1 "Geist Mono",monospace;background:#16161a;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px 20px}
.cmd span{color:#6b6b74;margin-right:12px}
.url{font:500 20px/1 "Geist Mono",monospace;color:#6b6b74;margin-left:auto}
</style></head>
<body><div class="wrap">
  <div class="logo"><img src="../../web/logo-white.svg" alt="OneHuman"></div>
  <div class="eyebrow">For B2B SaaS, Enterprise</div>
  <h1>Your customers log in with <span class="a">AI agents</span>. Decide what they may see and do.</h1>
  <p class="sub">Private data hidden from agents. The owner approves anything risky. Every decision signed on your server.</p>
  <div class="foot"><div class="cmd"><span>$</span>npx onehumanai init</div><div class="url">onehuman.ai</div></div>
</div></body></html>
